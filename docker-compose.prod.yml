services:
  postgres:
    image: postgres:16-alpine
    container_name: camwatch-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Sin ports expuestos — solo accesible internamente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: camwatch-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: camwatch-web
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bun server.js

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: camwatch-migrate
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    # Se ejecuta con `docker compose run --rm migrate`
    # No se levanta con `up -d`
    profiles:
      - migration

  # Nginx no incluido — Plesk gestiona el proxy reverso al puerto 3000
  # Ver README sección "Plesk — Configurar subdominio para Docker"

volumes:
  postgres-data:
  redis-data:
