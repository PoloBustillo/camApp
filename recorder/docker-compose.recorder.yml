version: "3.9"

services:
  recorder:
    build: .
    restart: unless-stopped
    volumes:
      - /mnt/recordings:/recordings
    environment:
      - CAMERAS=${CAMERAS}
      - SEGMENT_TIME=${SEGMENT_TIME:-600}
      - RETRY_DELAY=${RETRY_DELAY:-10}
      - TZ=America/Mexico_City
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # Only expose to Tailscale interface; can also use 0.0.0.0 with firewall
    ports:
      - "8080:80"
    volumes:
      - /mnt/recordings:/usr/share/nginx/html/recordings:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recorder
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
